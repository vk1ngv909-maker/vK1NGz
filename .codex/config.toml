# Reference Codex CLI config.
# scripts/setup-codex.sh copies this to ~/.codex/config.toml.
# Docs: https://github.com/openai/codex/blob/main/docs/config.md

# Model is intentionally left unset so Codex uses its own current default.
# Override per-run with `codex exec -m <model>` if needed.

model_reasoning_effort = "medium"

# Non-interactive / CI-friendly defaults for this sandboxed container.
approval_policy = "never"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

# Inherit the container's proxy and CA-bundle environment so HTTPS works.
[shell_environment_policy]
inherit = "all"
